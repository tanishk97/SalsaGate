name: Approve and Deploy

on:
  workflow_dispatch:

jobs:
  approve_and_deploy:
    name: Manual Approval → Upload to S3
    runs-on: ubuntu-latest
    env:
      CI: "false"
      ACT: "false"
      ARTIFACT_NAME: "artifact.zip"
      S3_BUCKET: "demo-bucket"
      AWS_ENDPOINT_URL_S3: ""
      AWS_REGION: "us-east-1"
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}  # Added job-level secret variable
    # Removed dynamic environment assignment due to context errors

    steps:
      - name: Checkout for local runs
        if: ${{ env.ACT == 'true' }}
        uses: actions/checkout@v4

      - name: Assume AWS Role via OIDC (CI only)
        if: ${{ env.CI == 'true' && env.ACT != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}  # Updated to use job-level env variable
          aws-region: ${{ env.AWS_REGION }}

      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dl

      - name: Verify checksum (must pass before upload)
        run: |
          set -e
          FILE="dl/${{ env.ARTIFACT_NAME }}"
          EXPECTED=$(cat "${FILE}.sha256")
          ACTUAL=$(shasum -a 256 "$FILE" | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL" || (echo "❌ Checksum mismatch" && exit 1)
          echo "✅ Checksum OK."

      - name: Upload to S3
        run: |
          if [ "${ACT:-}" = "true" ] && [ -n "${AWS_ENDPOINT_URL_S3:-}" ]; then
            aws s3 --endpoint-url "$AWS_ENDPOINT_URL_S3" cp "dl/${{ env.ARTIFACT_NAME }}" "s3://${{ env.S3_BUCKET }}/releases/${{ github.sha }}/${{ env.ARTIFACT_NAME }}"
            aws s3 --endpoint-url "$AWS_ENDPOINT_URL_S3" cp "dl/${{ env.ARTIFACT_NAME }}.sha256" "s3://${{ env.S3_BUCKET }}/releases/${{ github.sha }}/${{ env.ARTIFACT_NAME }}.sha256"
          else
            aws s3 cp "dl/${{ env.ARTIFACT_NAME }}" "s3://${{ env.S3_BUCKET }}/releases/${{ github.sha }}/${{ env.ARTIFACT_NAME }}"
            aws s3 cp "dl/${{ env.ARTIFACT_NAME }}.sha256" "s3://${{ env.S3_BUCKET }}/releases/${{ github.sha }}/${{ env.ARTIFACT_NAME }}.sha256"
          fi
