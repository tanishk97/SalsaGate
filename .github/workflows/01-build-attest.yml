---
# yamllint disable rule:line-length
name: build-sign-attest-upload
'on':
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STAGING_BUCKET: <REPLACE_ME>
  ACCOUNT_ID: <REPLACE_ME>
  ROLE_ARN: arn:aws:iam::<ACCOUNT_ID>:role/GHAOIDCDeployRole

jobs:
  build_attest_upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build site bundle
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            echo "<html><body>SalsaGate</body></html>" > dist/index.html
          fi
          tar -czf site-${{ github.sha }}.tgz -C dist .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./dist
          format: spdx-json
          output-file: sbom-${{ github.sha }}.spdx.json

      - name: Create provenance predicate
        run: |
          cat > provenance.json <<'JSON'
          {
            "buildType": "https://github.com/actions/build",
            "buildConfig": {
              "repo": "${{ github.repository }}",
              "sha": "${{ github.sha }}"
            }
          }
          JSON

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign tarball
        run: |
          cosign sign-blob --yes \
            --output-signature site-${{ github.sha }}.tgz.sig \
            --output-certificate site-${{ github.sha }}.tgz.pem \
            site-${{ github.sha }}.tgz

      - name: Attest tarball
        run: |
          cosign attest-blob --yes \
            --predicate provenance.json \
            --type slsaprovenance \
            --bundle site-${{ github.sha }}.tgz.attestation.sigstore \
            site-${{ github.sha }}.tgz

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3 staging bucket
        run: |
          aws s3 cp site-${{ github.sha }}.tgz \
            s3://${{ env.STAGING_BUCKET }}/site-${{ github.sha }}.tgz
          aws s3 cp site-${{ github.sha }}.tgz.sig \
            s3://${{ env.STAGING_BUCKET }}/site-${{ github.sha }}.tgz.sig
          aws s3 cp site-${{ github.sha }}.tgz.pem \
            s3://${{ env.STAGING_BUCKET }}/site-${{ github.sha }}.tgz.pem
          aws s3 cp site-${{ github.sha }}.tgz.attestation.sigstore \
            s3://${{ env.STAGING_BUCKET }}/site-${{ github.sha }}.tgz.attestation.sigstore
          aws s3 cp sbom-${{ github.sha }}.spdx.json \
            s3://${{ env.STAGING_BUCKET }}/sbom-${{ github.sha }}.spdx.json
          aws s3 cp provenance.json \
            s3://${{ env.STAGING_BUCKET }}/provenance.json
