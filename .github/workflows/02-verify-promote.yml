---
# yamllint disable rule:line-length
name: verify-and-promote
'on':
  workflow_dispatch:
    inputs:
      object_key:
        description: "Staging S3 key (e.g., site-<sha>.tgz)"
        required: true
      promote:
        description: "Promote if verified?"
        default: "true"
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STAGING_BUCKET: <REPLACE_ME>
  WEBSITE_BUCKET: <REPLACE_ME>
  ACCOUNT_ID: <REPLACE_ME>
  ROLE_ARN: arn:aws:iam::<ACCOUNT_ID>:role/GHAOIDCDeployRole

jobs:
  verify_and_promote:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download artifacts from staging
        run: |
          aws s3 cp s3://${{ env.STAGING_BUCKET }}/${{ inputs.object_key }} .
          aws s3 cp s3://${{ env.STAGING_BUCKET }}/${{ inputs.object_key }}.sig .
          aws s3 cp s3://${{ env.STAGING_BUCKET }}/${{ inputs.object_key }}.pem .
          aws s3 cp s3://${{ env.STAGING_BUCKET }}/${{ inputs.object_key }}.attestation.sigstore .

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify signature
        run: |
          cosign verify-blob \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/.+" \
            --signature ${{ inputs.object_key }}.sig \
            --certificate ${{ inputs.object_key }}.pem \
            ${{ inputs.object_key }}

      - name: Verify SLSA attestation
        run: |
          cosign verify-blob-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/.+" \
            --bundle ${{ inputs.object_key }}.attestation.sigstore \
            ${{ inputs.object_key }}

      - name: Promote to website
        if: ${{ inputs.promote == 'true' }}
        run: |
          aws s3 cp s3://${{ env.STAGING_BUCKET }}/${{ inputs.object_key }} \
            s3://${{ env.WEBSITE_BUCKET }}/${{ inputs.object_key }} \
            --tagging "trust=verified" \
            --tagging-directive REPLACE \
            --metadata-directive REPLACE
